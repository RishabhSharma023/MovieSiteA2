<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazin' Prime Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">Amazin' Prime Video</div>
        <img class ="logoImg" src="amazingprimeVid.png" alt="">
        </div>
        <div class="login-container">
            <div class="username">
                <form>
                    <label>Username: </label>
                    <input type="text"><br>
                </form>
            </div>
            <div class="password">
                <form>
                    <label>Password: </label>
                    <input type="password"><br>
                </form>
            </div>
            <div class="login">
                <form>
                    <!--input type="button" value="Login / Register"-->
                    <button class="button">Login / Register</button>
                </form>
            </div>
        </div>
    </header>
    <div class="hero">
        <div class="hero-text">
            <img class = "poster" src="captAm.jpg" alt="">
        </div>
    </div>
    <div class="featured">
        <h2>Other Shows and Movies You May Like:</h2>
        <div class="posters">
            <img class="poster" src="infWar.jpg" alt="">
            <img class="poster" src="endGame.jpg" alt="">
            <img class="poster" src="fatws.jpg" alt="">
        </div>
    </div>

    <footer class="footer">
        <div class="footerText">
            <p>&copy; 2025 Amazing Prime Video</p>
            <p>Support: +1 416-416-4164</p>
        </div>
</body>
</html>
